name: Tests and macOS build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11'
          - os: ubuntu-24.04
            python: '3.14'
          - os: macos-14
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Linux OCR and Qt dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng libegl1 libopengl0 libxkbcommon0 libdbus-1-3
      - name: Build system Vision OCR helper (no Tesseract install)
        if: runner.os == 'macOS'
        run: python build_support/build_vision.py
      - run: python -m pip install -e '.[ocr]'
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - name: Offline application smoke check
        run: python -m nomi --self-test

  macos-build:
    needs: tests
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -e '.[ocr,build]'
      - run: python -m PyInstaller --noconfirm build_support/Nomi.spec
      - name: Test packaged app with Finder-like PATH
        env:
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
          QT_QPA_PLATFORM: offscreen
        run: dist/Nomi.app/Contents/MacOS/Nomi --self-test
      - name: Archive application bundle preserving symlinks
        run: ditto -c -k --sequesterRsrc --keepParent dist/Nomi.app dist/Nomi-macos.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Nomi-macos
          path: dist/Nomi-macos.zip
          if-no-files-found: error
