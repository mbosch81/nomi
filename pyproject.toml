[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nomi-renamer"
version = "0.4.1"
license = "MIT"
license-files = ["LICENSE"]
description = "Jede Datei verdient einen Namen."
requires-python = ">=3.11,<3.15"
dependencies = ["PySide6>=6.9,<6.11", "pypdf>=6,<7", "fonttools>=4.60,<5"]

[project.optional-dependencies]
ocr = ["pypdfium2>=5,<6", "Pillow>=12,<13"]

build = ["pyinstaller>=6.22,<7"]

[project.scripts]
nomi = "nomi.app:main"

[tool.setuptools.packages.find]
include = ["nomi*"]
