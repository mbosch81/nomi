[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nomi-renamer"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Jede Datei verdient einen Namen."
requires-python = ">=3.11,<3.15"
dependencies = ["PySide6>=6.9,<6.11", "pypdf>=6,<7"]

[project.scripts]
nomi = "nomi.app:main"

[tool.setuptools.packages.find]
include = ["nomi*"]
